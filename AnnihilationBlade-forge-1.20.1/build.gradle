plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = 'org.examplea.annihilationblade'
version = '1.4.1'

base {
    archivesName = 'annihilationblade'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // 必须确保为 true，强迫 IDEA 在非 Gradle 启动时复制资源文件
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // 保持硬编码，确保 IDEA 原生运行配置生成时类路径映射正确
            mods {
                annihilationblade {
                    source sourceSets.main
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
    }
}

mixin {
    add sourceSets.main, 'annihilationblade.refmap.json'
    config 'annihilationblade.mixins.json'
}

sourceSets {
    main {
        resources {
            srcDirs = [
                    "src/main/resources",
                    "src/generated/resources"
            ]
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 1. 用于让你的代码能正常 import 拔刀剑的类（编译期）
    implementation(fg.deobf("curse.maven:slashblade-resharped-1022428:6164820")) {
        exclude group: 'org.apache.logging.log4j'
    }

    // 2. 强迫 Gradle 运行时（含 IDEA 运行）必须将拔刀剑的 Jar 放入游戏加载列表
    runtimeOnly(fg.deobf("curse.maven:slashblade-resharped-1022428:6164820"))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from(project.files('../LICENSE', '../LICENSE-MODELS.md')) {
        into 'META-INF'
    }
    archiveFileName = "annihilationblade-forge-${minecraft_version}-${project.version}.jar"
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "annihilationblade.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
